[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spiffe-security-bench"
version = "0.1.0"
description = "Security benchmark for SPIFFE/SPIRE deployments"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.scripts]
spiffe-security-bench = "spiffe_bench.cli:cli"
