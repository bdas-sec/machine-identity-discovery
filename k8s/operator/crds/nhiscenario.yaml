apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nhiscenarios.nhi.security
  labels:
    app.kubernetes.io/name: nhi-operator
    app.kubernetes.io/part-of: nhi-testbed
  annotations:
    description: >-
      NHIScenario defines an attack scenario for purple team testing of
      Non-Human Identity (NHI) security controls. Each scenario describes
      a multi-phase attack with expected SIEM alerts and remediation guidance.
spec:
  group: nhi.security
  names:
    kind: NHIScenario
    listKind: NHIScenarioList
    plural: nhiscenarios
    singular: nhiscenario
    shortNames:
      - nhi
      - scenario
    categories:
      - nhi
      - security
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: CATEGORY
          type: string
          jsonPath: .spec.category
        - name: DIFFICULTY
          type: string
          jsonPath: .spec.difficulty
        - name: PHASES
          type: integer
          jsonPath: .spec.phaseCount
          description: Number of attack phases
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: NHIScenario represents a purple team attack scenario targeting non-human identities.
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - category
                - description
                - phases
              properties:
                category:
                  type: string
                  description: >-
                    Attack category — aligns with scenario directory naming.
                    Examples: spiffe-spire, credential-discovery, cloud-metadata,
                    cicd-pipeline, kubernetes, ai-agents, infrastructure.
                difficulty:
                  type: string
                  description: Difficulty level for executing this attack scenario.
                  enum:
                    - Easy
                    - Medium
                    - Hard
                    - Expert
                  default: Medium
                description:
                  type: string
                  description: Human-readable description of what this scenario tests.
                phaseCount:
                  type: integer
                  description: >-
                    Computed field for printer column — set by the operator
                    to len(phases). Do not set manually.
                mitreAttack:
                  type: object
                  description: MITRE ATT&CK mapping for this scenario.
                  properties:
                    tactics:
                      type: array
                      description: MITRE ATT&CK tactics (e.g., Credential Access, Lateral Movement).
                      items:
                        type: string
                    techniques:
                      type: array
                      description: MITRE ATT&CK techniques with IDs.
                      items:
                        type: object
                        required:
                          - id
                          - name
                        properties:
                          id:
                            type: string
                            description: "Technique ID (e.g., T1078, T1552.001)."
                          name:
                            type: string
                            description: Technique name.
                phases:
                  type: array
                  description: >-
                    Ordered list of attack phases. Each phase may contain
                    multiple actions executed sequentially.
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                      - actions
                    properties:
                      name:
                        type: string
                        description: Phase name (e.g., "Credential Discovery", "Privilege Escalation").
                      description:
                        type: string
                        description: What this phase accomplishes in the attack flow.
                      critical:
                        type: boolean
                        description: >-
                          If true, failure of this phase aborts the entire
                          scenario run. Non-critical phases log warnings but
                          continue execution.
                        default: false
                      actions:
                        type: array
                        description: Actions to execute in this phase.
                        minItems: 1
                        items:
                          type: object
                          required:
                            - type
                            - command
                          properties:
                            type:
                              type: string
                              description: >-
                                Action type. "exec" runs a command in a target
                                container/pod. "http" makes an HTTP request.
                              enum:
                                - exec
                                - http
                            target:
                              type: string
                              description: >-
                                Target service or pod selector for this action
                                (e.g., "spire-server", "cloud-workload").
                            command:
                              type: string
                              description: >-
                                Shell command to execute (for type=exec) or URL
                                to request (for type=http).
                            description:
                              type: string
                              description: Human-readable description of this action.
                expectedAlerts:
                  type: array
                  description: >-
                    Wazuh alerts that should fire when this scenario executes
                    successfully. Used to calculate detection rate.
                  items:
                    type: object
                    required:
                      - ruleId
                    properties:
                      ruleId:
                        type: string
                        description: "Wazuh rule ID (e.g., 101020)."
                      level:
                        type: integer
                        description: Expected alert severity level (0-15).
                        minimum: 0
                        maximum: 15
                      description:
                        type: string
                        description: Expected alert description text.
                remediation:
                  type: object
                  description: Guidance for defending against this attack.
                  properties:
                    immediate:
                      type: array
                      description: Actions to take right now to contain the attack.
                      items:
                        type: string
                    longTerm:
                      type: array
                      description: Architectural improvements to prevent recurrence.
                      items:
                        type: string
      subresources:
        status: {}
