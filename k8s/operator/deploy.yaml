---
# Namespace for the NHI operator and its resources
apiVersion: v1
kind: Namespace
metadata:
  name: nhi-system
  labels:
    app.kubernetes.io/name: nhi-operator
    app.kubernetes.io/part-of: nhi-testbed
---
# ServiceAccount for the operator pod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nhi-operator
  namespace: nhi-system
  labels:
    app.kubernetes.io/name: nhi-operator
    app.kubernetes.io/component: operator
---
# ClusterRole granting the operator access to CRDs, Jobs, Pods, and Events
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nhi-operator
  labels:
    app.kubernetes.io/name: nhi-operator
    app.kubernetes.io/component: operator
rules:
  # NHIScenario and NHIScenarioRun custom resources
  - apiGroups: ["nhi.security"]
    resources:
      - nhiscenarios
      - nhiscenarioruns
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Status subresource for CRDs
  - apiGroups: ["nhi.security"]
    resources:
      - nhiscenarios/status
      - nhiscenarioruns/status
    verbs: ["get", "update", "patch"]
  # Jobs for executing attack phases
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Pods for monitoring Job execution
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Events for operator status reporting
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # kopf needs access to its coordination resources
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # kopf peering
  - apiGroups: ["kopf.dev"]
    resources: ["clusterkopfpeerings"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
# Bind the ClusterRole to the operator ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nhi-operator
  labels:
    app.kubernetes.io/name: nhi-operator
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nhi-operator
subjects:
  - kind: ServiceAccount
    name: nhi-operator
    namespace: nhi-system
---
# ConfigMap for Wazuh API connection settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: nhi-operator-config
  namespace: nhi-system
  labels:
    app.kubernetes.io/name: nhi-operator
    app.kubernetes.io/component: operator
data:
  WAZUH_API_URL: "https://wazuh-manager:55000"
  WAZUH_API_USER: "wazuh-wui"
  DETECTION_TIMEOUT: "60"
  JOB_IMAGE: "alpine:3.19"
  JOB_NAMESPACE: "nhi-system"
---
# Secret for Wazuh API password (base64-encoded: MyS3cr37P450r.*-)
apiVersion: v1
kind: Secret
metadata:
  name: nhi-operator-wazuh
  namespace: nhi-system
  labels:
    app.kubernetes.io/name: nhi-operator
    app.kubernetes.io/component: operator
type: Opaque
data:
  # echo -n 'MyS3cr37P450r.*-' | base64
  WAZUH_API_PASSWORD: TXlTM2NyMzdQNDUwci4qLQ==
---
# Operator Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nhi-operator
  namespace: nhi-system
  labels:
    app.kubernetes.io/name: nhi-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: nhi-testbed
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nhi-operator
      app.kubernetes.io/component: operator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nhi-operator
        app.kubernetes.io/component: operator
        app.kubernetes.io/part-of: nhi-testbed
    spec:
      serviceAccountName: nhi-operator
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: operator
          image: ghcr.io/nhi-testbed/operator:latest
          imagePullPolicy: IfNotPresent
          command: ["kopf", "run", "operator.py", "--verbose", "--all-namespaces"]
          envFrom:
            - configMapRef:
                name: nhi-operator-config
            - secretRef:
                name: nhi-operator-wazuh
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      nodeSelector:
        kubernetes.io/os: linux
