kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nhi-testbed
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-log-path: /var/log/kubernetes/audit.log
            audit-policy-file: /etc/kubernetes/audit-policy.yaml
            audit-log-maxage: "7"
            audit-log-maxbackup: "3"
            audit-log-maxsize: "100"
        extraVolumes:
          - name: audit-policy
            hostPath: /etc/kubernetes/audit-policy.yaml
            mountPath: /etc/kubernetes/audit-policy.yaml
            readOnly: true
          - name: audit-logs
            hostPath: /var/log/kubernetes
            mountPath: /var/log/kubernetes
    extraPortMappings:
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
      - containerPort: 30000
        hostPort: 3001
        protocol: TCP
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
    labels:
      nhi.testbed/role: workload
  - role: worker
    labels:
      nhi.testbed/role: workload
