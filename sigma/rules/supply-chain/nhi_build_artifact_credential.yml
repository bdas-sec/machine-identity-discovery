title: "NHI-Supply Chain: Credentials Detected in Build Artifacts"
id: d4e5f6a7-b8c9-4d0e-1f2a-3b4c5d6e7f8a
related:
    - id: "100983"
      type: derived
status: test
description: |
    Detects credential patterns (AWS keys, GitHub tokens, API secrets) appearing
    in build artifact paths, Docker images, or package outputs. Indicates that
    secrets may have been accidentally or deliberately injected into build
    artifacts that will be deployed to production.
    Real-world: SolarWinds SUNBURST (build injection), 3CX supply chain
    attack (2023), PyPI malicious packages embedding credentials.
    Derived from Wazuh rule 100983.
references:
    - https://attack.mitre.org/techniques/T1195/002/
    - https://slsa.dev/
    - https://www.sigstore.dev/
author: Bodhisattva Das
date: 2026-03-11
tags:
    - attack.persistence
    - attack.defense_evasion
    - attack.t1195.002
    - attack.t1027
    - nhi.supply_chain
logsource:
    category: process_creation
    product: linux
detection:
    selection_artifact_path:
        CommandLine|contains:
            - 'build/'
            - 'artifact'
            - 'dist/'
            - 'output/'
            - 'release/'
            - 'package/'
    selection_credential_pattern:
        CommandLine|re: '(?i)(AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|ghs_[a-zA-Z0-9]{36}|sk-[a-zA-Z0-9]{48}|password\s*=|secret\s*=|AWS_SECRET|PRIVATE.KEY)'
    condition: selection_artifact_path and selection_credential_pattern
falsepositives:
    - Secret scanning tools legitimately checking build artifacts
    - Documentation references to credential formats
level: high
