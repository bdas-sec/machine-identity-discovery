title: "NHI: OAuth/OIDC Attack Chain Correlation"
id: e5f6a7b8-c9d0-4e1f-2a3b-4c5d6e7f8a9b
related:
    - id: "100978"
      type: derived
status: experimental
description: |
    Correlation rule detecting multiple OAuth/OIDC attack indicators
    within a 5-minute window, suggesting a coordinated attack chain.
    This includes combinations of: OIDC federation token exchange,
    consent escalation, refresh token abuse, audience confusion, and
    service principal credential manipulation. The presence of 3 or
    more indicators within the timeframe strongly suggests an active
    OAuth/OIDC exploitation campaign targeting non-human identities.
    Derived from Wazuh correlation rule 100978.
references:
    - https://attack.mitre.org/techniques/T1078/004/
    - https://attack.mitre.org/techniques/T1098/003/
    - https://attack.mitre.org/techniques/T1528/
author: Bodhisattva Das
date: 2026-03-11
tags:
    - attack.credential_access
    - attack.t1078.004
    - attack.persistence
    - attack.t1098.003
    - nhi.oauth_oidc
    - nhi.correlation
logsource:
    category: application
    product: sts_federation
detection:
    selection:
        msg|contains:
            - 'ATTACK'
            - 'STS_FEDERATION'
    filter_health:
        msg|contains:
            - 'HEALTH_CHECK'
    condition: selection and not filter_health | count() by source_ip >= 3
    timeframe: 5m
falsepositives:
    - Penetration testing or red team exercises
    - Automated security scanning tools
level: critical
