title: "NHI-AI Agent: MCP Server Credential Relay"
id: a7b8c9d0-e1f2-4a3b-4c5d-6e7f8a9b0c1d
related:
    - id: "100861"
      type: derived
    - id: "100862"
      type: derived
status: test
description: |
    Detects Model Context Protocol (MCP) server tools being used to access
    credential files or environment variables, followed by relay of that
    data to an external endpoint. Attackers exploit MCP tool invocations
    to read credentials (read_file, get_file) and then exfiltrate them
    via HTTP tools (http_request, fetch, post) to external services.
    Real-world: MCP tool abuse in Cursor IDE, Slack MCP server credential
    exposure (2025), LangChain tool chain credential exfiltration.
    Derived from Wazuh rules 100861/100862.
references:
    - https://modelcontextprotocol.io/
    - https://owasp.org/www-project-top-10-for-large-language-model-applications/
    - https://attack.mitre.org/techniques/T1071/
author: Bodhisattva Das
date: 2026-03-11
tags:
    - attack.exfiltration
    - attack.credential_access
    - attack.t1071
    - attack.t1552
    - nhi.ai_agent
logsource:
    category: process_creation
    product: linux
detection:
    selection_mcp_cred_access:
        CommandLine|contains:
            - 'mcp'
            - 'tool_use'
            - 'function_call'
        CommandLine|contains:
            - 'read_file'
            - 'file_read'
            - 'get_file'
        CommandLine|contains:
            - 'credentials'
            - '.aws/'
            - '.env'
            - '.vault-token'
            - '.kube/config'
            - 'id_rsa'
    selection_external_relay:
        CommandLine|contains:
            - 'http_request'
            - 'fetch'
            - 'webhook'
        CommandLine|re: 'https?://(?!localhost|127\.0\.0\.1|10\.|172\.|192\.168\.)'
    condition: selection_mcp_cred_access or selection_external_relay
falsepositives:
    - Legitimate MCP tools performing authorized file operations
    - Development tools reading configuration files for setup
level: high
